<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Observatory</title>
    <script>
      /*
        Resolve the theme before the first paint and hand the *mode* to React.

        One decision, one switch: the `<html class="dark">` class plus
        `color-scheme`. The rule below is byte-for-byte the same rule the shell
        applies (`resolveDark` in src/components/app-shell.tsx), so React never
        disagrees with the frame that is already on screen — that disagreement is
        what produced a white flash for dark-mode operators in 0.2.x.
      */
      (function () {
        try {
          var stored = localStorage.getItem("observatory.theme");
          var mode = stored === "light" || stored === "dark" ? stored : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          window.__OBS_THEME_MODE__ = mode;
        } catch (e) {
          /* Private mode with storage disabled — light is a safe first frame. */
          document.documentElement.style.colorScheme = "light";
          window.__OBS_THEME_MODE__ = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

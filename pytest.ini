[pytest]
minversion = 8.0
testpaths = tests
pythonpath = . server agent
addopts = -ra --strict-markers --strict-config --timeout=180 -m "not perf"
timeout_method = thread
# 沙箱下仓库根目录的 .pytest_cache 可能不可写；缓存放进工作区临时目录
cache_dir = .pytest-tmp/pytest-cache

markers =
    unit: 纯函数测试（坐标、presence 矩阵、信封、预算）
    contract: 协议 v3 双向与 legacy 0.2.10 回放
    acceptance: A1..A24 Definition of Done（编号一一对应）
    integration: 真起服务端 + 假受控端（W1 后替换为真受控端）
    perf: N4 性能基线对比（默认不在 CI 全量跑）
    windows_only: 只能在 Windows runner 上跑（命名管道/注入/服务控制）
    slow: 超过 5s 的用例

filterwarnings =
    error::DeprecationWarning:tests.*
    default::DeprecationWarning
# Observatory 0.3.0 生产部署
#
#   cp server/.env.example server/.env   # 填好密钥（生产不要用 .env.dev）
#   docker compose -f deploy/docker-compose.yml --env-file server/.env up -d --build
#
# 0.3.0 安全默认值（A11/A24）：
#   * 8443 默认只绑 127.0.0.1，由本机 nginx 反代；只有 CDN/上游代理直连时才设
#     OBS_BIND_ADDR=0.0.0.0（并配合防火墙）。
#   * 容器以非 root（OBS_UID，默认 10001）运行、只读根文件系统、/data 可写、
#     丢弃全部 capabilities、限制内存/CPU/PID。
#   * 数据卷、数据库与画面都落在 observatory-data；证书只读挂载 ../certs。

name: observatory

services:
  api:
    # 0.3.7 末重构：镜像由 GitHub Actions 构建并推 ghcr.io，服务器只 pull+up。
    # OBS_IMAGE_TAG 传完整镜像引用（ghcr.io/h2o-me/observatory:<sha>），回滚即指回旧值。
    image: ${OBS_IMAGE_TAG:-ghcr.io/h2o-me/observatory:latest}
    container_name: observatory-api
    restart: unless-stopped
    env_file:
      - ../server/.env
    ports:
      # A11：默认只监听回环，nginx 反代；直连部署需显式设置 OBS_BIND_ADDR=0.0.0.0。
      - "${OBS_BIND_ADDR:-127.0.0.1}:${OBS_PORT:-8443}:8443"
    volumes:
      - observatory-data:/data
      - ../certs:/certs:ro
    user: "${OBS_UID:-10001}:${OBS_UID:-10001}"
    read_only: true
    environment:
      OBS_DATA_DIR: /data
      # F45: tzdata 已装进镜像，不设 TZ 时日志时间戳全是 UTC，与宿主 nginx
      # 日志差 8 小时，排障对时间线会被误导。
      TZ: ${OBS_TZ:-Asia/Shanghai}
      # F45: 包上传的 multipart spool 落在 /tmp（64MB tmpfs 装不下大安装包，
      # 上传 >64MB 必 ENOSPC）。改到数据卷上的临时目录。
      TMPDIR: /data/tmp
    tmpfs:
      # 0.3.1 F45: 64m → 1g 兜底（即使 TMPDIR 失效，小包上传也不再必炸）
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 16G 机器与 mysql/new-api 等共居，给 2G/4 核裕量（构建不受此限制）
    mem_limit: ${OBS_MEM_LIMIT:-2g}
    cpus: ${OBS_CPUS:-4.0}
    pids_limit: ${OBS_PIDS_LIMIT:-256}
    # F45: 20s 长轮询 hold + 优雅关闭窗口顶死会 SIGKILL 在途连接；30s + 进程内
    # --timeout-graceful-shutdown 15 让受控端先收到正常断连。
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;ctx=ssl._create_unverified_context();print(urllib.request.urlopen('https://127.0.0.1:8443/api/v1/health',context=ctx,timeout=5).status)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  observatory-data:
    name: observatory-data
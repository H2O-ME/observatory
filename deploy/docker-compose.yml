# Observatory 生产部署
#
#   cp server/.env.example server/.env   # 填好密钥
#   docker compose --env-file server/.env up -d --build
#
# 数据卷里放数据库、画面、安装包和构建好的控制台；只有 TLS 端口对外开放。

name: observatory

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: observatory/api:${OBS_IMAGE_TAG:-latest}
    container_name: observatory-api
    restart: unless-stopped
    env_file:
      - ../server/.env
    environment:
      OBS_DATA_DIR: /data
    ports:
      # 默认绑定所有网卡：这类部署的公网入口通常由 CDN / 上游代理直连 8443。
      # 如果在同一台机器上用 nginx 终止 TLS，把 OBS_BIND_ADDR 设为 127.0.0.1。
      - "${OBS_BIND_ADDR:-0.0.0.0}:${OBS_PORT:-8443}:8443"
    volumes:
      - observatory-data:/data
      - ../certs:/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;ctx=ssl._create_unverified_context();print(urllib.request.urlopen('https://127.0.0.1:8443/api/v1/health',context=ctx,timeout=5).status)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  observatory-data:
    name: observatory-data
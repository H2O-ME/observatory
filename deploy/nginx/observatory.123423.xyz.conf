# observatory.123423.xyz — 仅受控端接入（安装脚本 + 设备接口）
#
# 这个域名不提供控制台。nginx 在这里直接拦掉页面与后台接口，
# 应用层的 HostSplit 中间件会再拦一次——因为 Host 头可以伪造。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name observatory.123423.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name observatory.123423.xyz;

    ssl_certificate     /etc/letsencrypt/live/observatory.123423.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observatory.123423.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 600m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # 控制台页面与后台接口一律不对外。
    location = / {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装，控制台请访问 https://control.tianhw.top\n";
    }

    location ^~ /assets/ {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装\n";
    }

    location ^~ /api/v1/auth/ {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装\n";
    }

    location ^~ /api/v1/devices {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装\n";
    }

    location ^~ /api/v1/settings {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装\n";
    }

    location ^~ /api/v1/audit {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装\n";
    }

    location ^~ /api/v1/updates {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装\n";
    }

    location ^~ /api/v1/system {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装\n";
    }

    location ^~ /api/v1/ws {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装\n";
    }

    # 只有这些路径透传到应用：受控端接口、安装脚本、版本与健康检查。
    location /api/v1/agent/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_buffering off;
    }

    location /api/v1/public/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location = /api/v1/health {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location = /api/v1/version {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location = /install.ps1 {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location / {
        default_type text/plain;
        return 404 "该域名仅用于受控端接入与安装，控制台请访问 https://control.tianhw.top\n";
    }
}
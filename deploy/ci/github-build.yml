name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: VERSION 与各副本一致
        run: python tools/set_version.py --check
      - name: 标签与 VERSION 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag 与 VERSION $version 不一致" >&2
            exit 1
          fi

  server:
    name: 服务端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 安装依赖
        run: pip install -r server/requirements.txt
      - name: 编译检查
        run: python -m compileall -q server/observatory agent/observatory_agent
      - name: 单元测试
        env:
          OBS_DATA_DIR: ${{ runner.temp }}/obs-data
          OBS_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
          OBS_ADMIN_PASSWORD: ci-password-123
          OBS_ENROLL_CODE: ci-enroll
        run: |
          cd server
          python ../tools/test_server.py

  webui:
    name: 控制台
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: webui/package-lock.json }
      - name: 安装依赖
        run: cd webui && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund)
      - name: 类型检查与构建
        run: cd webui && npm run build

  agent:
    name: 受控端（Windows）
    runs-on: windows-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: 构建
        shell: pwsh
        run: pwsh -File agent/build/build.ps1 -SkipInstall:$false
      - name: 冒烟检查
        shell: pwsh
        run: |
          $exe = "agent/build/dist/observatory-agent/observatory-agent.exe"
          if (-not (Test-Path $exe)) { throw "没有产出 exe" }
          & $exe --version
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: observatory-agent
          path: agent/dist/observatory-agent-*.zip
          if-no-files-found: error
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: agent/dist/observatory-agent-*.zip
          generate_release_notes: true

  docker:
    name: 镜像
    runs-on: ubuntu-latest
    needs: [server, webui]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
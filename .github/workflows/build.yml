name: build

# A20（spec §3.1）CI 门禁：任何改动必须同时通过
#   1) 版本一致性（VERSION ↔ 副本 ↔ tag）
#   2) 服务端自检（装配/载体/编译）
#   3) 协议契约（v3 双向 + C9 发送点闭环；0.2.x 回放随 legacy 层删除退役）
#   4) 验收 A1..A24（W0 起以 skip 占位，W1+ 逐步转绿；N1 靠此 job 汇总）
#   5) WebUI 类型检查 + 生产构建
#   6) Windows runner 上的受控端逻辑测试 + PyInstaller 产物
#
# 依赖安装统一用 requirements-dev.txt（含 server/requirements.txt + pytest 全家桶）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OBS_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
  OBS_ADMIN_PASSWORD: ci-password-123

jobs:
  version:
    name: 版本号一致性
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: VERSION 与各副本一致
        run: python tools/set_version.py --check
      - name: 标签与 VERSION 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag 与 VERSION $version 不一致" >&2
            exit 1
          fi
      - name: 编译检查
        run: python -m compileall -q server/observatory agent/observatory_agent

  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: 安装 ruff
        run: pip install ruff
      - name: ruff check（A22：禁止裸静默异常）
        run: ruff check server agent tools tests

  server:
    name: 服务端自检
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt
      - name: 单元 + 集成测试
        run: python -m pytest tests/unit tests/integration -q -m "not windows_only and not perf"
      - name: 旧对外入口冒烟（tools/test_server.py → pytest --collect-only）
        run: python tools/test_server.py --collect-only -q

  contract:
    name: 协议兼容
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt
      - name: v3 契约 + legacy 0.2.10 回放
        run: python -m pytest tests/contract -q -m "not windows_only"
      - name: 旧受控端入口冒烟（tools/test_agent.py → collect-only）
        run: python tools/test_agent.py --collect-only -q

  acceptance:
    name: 验收 A1-A24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt
      - name: Definition of Done
        run: python -m pytest tests/acceptance -q -m "not windows_only"
      - name: 真机端到端入口冒烟（tools/test_e2e_live.py → collect-only）
        run: python tools/test_e2e_live.py --collect-only -q

  webui:
    name: 控制台
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm, cache-dependency-path: webui/package-lock.json }
      - name: 安装依赖
        # F62（0.3.1）：lockfile 与 package.json 不同步应该红灯，静默回退
        # npm install 会按语义版本拉最新依赖（供应链漂移 + 构建不可复现）。
        run: cd webui && npm ci --no-audit --no-fund
      - name: 类型检查
        run: cd webui && npm run typecheck
      - name: 生产构建
        run: cd webui && npm run build

  agent-windows:
    name: 受控端（Windows）
    runs-on: windows-latest
    timeout-minutes: 45
    # 只在全部质量门禁通过后才构建/发布受控端；旧版只依赖 version，
    # tag 构建可能在服务端/WebUI 测试红灯时仍把 agent-dist 推出去。
    needs: [version, lint, server, contract, acceptance, webui, deploy-static]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
      - name: 安装测试依赖
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt
          python -m pip install --quiet -r agent/requirements.txt
      - name: 受控端逻辑测试（含 windows_only 用例）
        run: python -m pytest tests/unit tests/contract -q -m "not perf"
      # F60（0.3.1）：A1/A2/A17 是 windows_only 验收——0.3.0 的 CI 里它们在
      # ubuntu acceptance job 被滤掉、Windows job 又不跑 acceptance，即最大的假绿。
      - name: Windows 验收（A1/A2/A17 等 windows_only 用例）
        run: python -m pytest tests/acceptance -q -m windows_only
      - name: Windows 系统层真实冒烟（管道 ACL/身份/DPI/SendInput/update/uninstall staging）
        run: python tools/win_smoke.py
      - name: 构建
        shell: pwsh
        run: pwsh -File agent/build/build.ps1
      - name: 冒烟检查
        shell: pwsh
        run: |
          $exe = "agent/build/dist/observatory-agent/observatory-agent.exe"
          if (-not (Test-Path $exe)) { throw "没有产出 exe" }
          $reported = (& $exe --version).Trim()
          $expected = (Get-Content VERSION -Raw).Trim()
          if ($reported -ne $expected) { throw "exe 报告 $reported，期望 $expected" }
          Write-Host "version ok: $reported"
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: observatory-agent
          path: agent/dist/observatory-agent-*.zip
          if-no-files-found: error
      # 交付给部署服务器：覆盖式推送单提交分支，历史里不会堆积二进制。
      - name: 发布到 agent-dist 分支
        # F62（0.3.1）：只在 tag 构建时发布——每次 push main 都 force push 二进制
        # 分支意味着任何能触发 workflow 的写权限者都能静默替换全员受控端。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          zip="agent/dist/observatory-agent-${version}.zip"
          [ -f "$zip" ] || { echo "没有找到 $zip" >&2; exit 1; }
          workdir="$(mktemp -d)"
          cp "$zip" "$workdir/"
          cd "$workdir"
          git init -q -b agent-dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$version" > VERSION
          sha256sum "observatory-agent-${version}.zip" > SHA256SUMS
          git add -A
          git commit -q -m "agent ${version}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            agent-dist:agent-dist
          echo "pushed agent-dist (${version})"
      - name: 发布摘要
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          agent_sha="$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/agent-dist | cut -f1)"
          {
            echo "### 发布完成 v${version}"
            echo ""
            echo "- 源码 commit: \`${GITHUB_SHA}\`"
            echo "- agent-dist: \`${agent_sha}\`"
            echo "- 安装包: \`observatory-agent-${version}.zip\`"
            echo ""
            echo "生产部署由本 workflow 的 \`deploy\` job（tag 触发）SSH 触发服务器 deploy.sh，"
            echo "自动拉取 main 并登记同版本 agent-dist；无需在服务器手工下载。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # SHA256SUMS 一并发布：deploy/build-agent.sh --from-release 靠它做
          # 完整性校验，登记通道（会被推给全部受控端执行）绝不容许未校验二进制。
          files: |
            agent/dist/observatory-agent-*.zip
            agent/dist/SHA256SUMS
          generate_release_notes: true

  deploy-static:
    name: 部署脚本静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: 安装体检脚本依赖（check_deployment.py 需要 httpx/websockets）
        run: python -m pip install --quiet --disable-pip-version-check httpx websockets
      - name: 体检脚本可编译、可启动（发布前工具）
        run: |
          set -euo pipefail
          python -m py_compile tools/check_deployment.py tools/check_deploy.py tools/set_version.py
          python tools/check_deployment.py --help >/dev/null
      - name: Shell 语法（bash -n）
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(deploy/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "deploy/ 下没有 shell 脚本" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
          done
      - name: 安装 shellcheck（不依赖 runner 预装版本）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: shellcheck（error 级阻断）
        run: shellcheck -S error deploy/*.sh
      - name: nginx 配置断言（占位符/证书/反代/WS map）
        run: python tools/check_deploy.py

  nginx-config-test:
    name: nginx -t
    # 改 nginx 模板的 PR 不该等到手动 dispatch 才发现配置非法——push/PR 也跑
    # （docker 起 nginx -t，约 1 分钟）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 渲染模板并在 nginx 容器里 nginx -t
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/conf" "$work/certs" "$work/certbot" "$work/logs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=control.example.test" \
            -keyout "$work/certs/privkey.pem" -out "$work/certs/fullchain.pem" 2>/dev/null
          sed -e 's|@@CONSOLE_HOST@@|control.example.test|g' \
              -e 's|@@AGENT_HOST@@|agent.example.test|g' \
              -e 's|/etc/letsencrypt/live/@@CERT_NAME@@|/w/certs|g' \
              -e 's|/var/www/certbot|/w/certbot|g' \
              deploy/nginx/console.conf.template > "$work/conf/console.conf"
          sed -e 's|@@CONSOLE_HOST@@|control.example.test|g' \
              -e 's|@@AGENT_HOST@@|agent.example.test|g' \
              -e 's|/etc/letsencrypt/live/@@CERT_NAME@@|/w/certs|g' \
              -e 's|/var/www/certbot|/w/certbot|g' \
              deploy/nginx/agent.conf.template > "$work/conf/agent.conf"
          cp deploy/nginx/observatory-map.conf "$work/conf/"
          cat > "$work/nginx.conf" <<'EOF'
          events {}
          http {
            access_log off;
            include /w/conf/*.conf;
          }
          EOF
          docker run --rm -v "$work:/w" nginx:1.27-alpine sh -c 'nginx -t -c /w/nginx.conf'

  perf:
    name: N4 性能基线（手动）
    if: github.event_name == 'workflow_dispatch'
    # F61（0.3.1）：N4 判据是同机相对基线（Windows 指纹），ubuntu runner 上
    # 4 个用例全部 skip、job 恒绿——门禁从未真正执行。移到 windows runner，
    # 并把 "出现 skip" 变成失败条件（指纹不匹配 = 基线失效，应当修基线而不是跳过）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt
      - name: N4 回归（skip 即失败）
        shell: pwsh
        run: |
          python -m pytest tests/perf -q -m perf -rs 2>&1 | Tee-Object -Variable out
          if ("$out" -match '\d+ skipped') { throw "N4 出现 skip：perf 基线指纹与 runner 不匹配，禁止空转绿灯" }

  deploy:
    name: 部署生产
    # 只在 tag 推送上部署；main push 只跑测试不部署。发布的正规入口是本机
    # tools/release.sh（bump → tag → push）。部署失败直接红灯在本 job；
    # 服务器侧 deploy.sh 另有自动回滚与熔断兜底。
    if: startsWith(github.ref, 'refs/tags/v')
    # 等 agent-windows 结束再部署：服务器登记的受控端包与本次服务端版本必须
    # 同源同版本（agent-dist 分支在该 job 内 force push）。
    needs: [version, lint, server, contract, acceptance, webui, deploy-static, nginx-config-test, agent-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 写入部署密钥
        env:
          OBS_DEPLOY_KEY: ${{ secrets.OBS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$OBS_DEPLOY_KEY" ] || { echo "缺少 secret OBS_DEPLOY_KEY" >&2; exit 1; }
          install -m 600 /dev/null "$HOME/obs_deploy_key"
          printf '%s\n' "$OBS_DEPLOY_KEY" > "$HOME/obs_deploy_key"
      - name: 触发部署并盯完结果
        env:
          OBS_DEPLOY_HOST: ${{ secrets.OBS_DEPLOY_HOST }}
          OBS_DEPLOY_PORT: ${{ secrets.OBS_DEPLOY_PORT }}
          OBS_DEPLOY_USER: ${{ secrets.OBS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          ssh_base=(-i "$HOME/obs_deploy_key" -p "$OBS_DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$OBS_DEPLOY_USER@$OBS_DEPLOY_HOST"
          # 点火（deploy.sh release 是异步 supervisor，立即返回；worker 在服务器
          # 上脱离会话运行，SSH 掉线不影响部署本身）。网络抖动重试 3 次。
          out=""
          for attempt in 1 2 3; do
            if out="$(ssh "${ssh_base[@]}" "$target" "release $tag" 2>&1)"; then
              echo "$out"
              break
            fi
            echo "$out" >&2
            if [ "$attempt" = 3 ]; then
              echo "SSH 触发部署失败（已重试 3 次）" >&2
              exit 1
            fi
            sleep 10
          done
          echo "$out" | grep -q "worker 已启动" || { echo "点火输出异常，中止" >&2; exit 1; }
          # 轮询状态文件直到 done（部署含 docker build，给 35 分钟）。
          for i in $(seq 1 140); do
            st="$(ssh "${ssh_base[@]}" "$target" status 2>/dev/null || echo 'phase=ssh-error')"
            echo "[poll $i] $(echo "$st" | tr '\n' ' ')"
            if grep -q '^result=success$' <<<"$st"; then
              exit 0
            fi
            if grep -q '^result=failed$' <<<"$st"; then
              echo "部署失败，服务器日志尾部：" >&2
              ssh "${ssh_base[@]}" "$target" "logs 120" >&2 || true
              exit 1
            fi
            sleep 15
          done
          echo "部署超时（35 分钟）未结束，服务器日志尾部：" >&2
          ssh "${ssh_base[@]}" "$target" "logs 120" >&2 || true
          exit 1
      - name: 部署摘要
        if: always()
        env:
          OBS_DEPLOY_HOST: ${{ secrets.OBS_DEPLOY_HOST }}
          OBS_DEPLOY_PORT: ${{ secrets.OBS_DEPLOY_PORT }}
          OBS_DEPLOY_USER: ${{ secrets.OBS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          {
            echo "### 发布 $tag"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "- 生产已部署并通过多点健康验证（容器内 / 宿主反代路径 / healthcheck / WebUI 版本）"
            else
              echo "- 部署未成功：服务器侧 deploy.sh 已自动回滚到上一个版本（见上方日志）"
            fi
            state="$(ssh -i "$HOME/obs_deploy_key" -p "$OBS_DEPLOY_PORT" -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "$OBS_DEPLOY_USER@$OBS_DEPLOY_HOST" status 2>/dev/null || true)"
            [ -n "$state" ] && echo '```' && echo "$state" && echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
